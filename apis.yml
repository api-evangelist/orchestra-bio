name: Orchestra Bio
description: >-
  Orchestra (orchestra.bio) is an agentic operations platform for drug
  development and life sciences R&D organizations, helping teams unify planning
  across leadership, programs, and scientific groups, automate R&D workflows,
  and reduce the operational risks that derail breakthrough science. The
  San Francisco company pairs unified program roadmaps with intelligent
  operations and decision support, and is backed by Andreessen Horowitz (a16z),
  8VC, Haystack, and other investors. It was added to the API Evangelist network
  as an a16z portfolio company. As of this enrichment pass Orchestra publishes a
  product marketing site, a company blog, and a hosted web application, but no
  public developer API, OpenAPI, SDK, or documentation surface.
